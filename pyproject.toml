[project]
name = "astro-island"
version = "1.0.0"
description = "A smooth, custom desktop Dynamic Island for Windows."
readme = "README.md"
authors = [
    { name = "xdkorm", email = "xdkormhub@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "imageio-ffmpeg>=0.8.1",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pyside6>=6.12.0",
]

[project.scripts]
astro-island = "astro_island.cli:island"
astro-island-settings = "astro_island.cli:settings"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
